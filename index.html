<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BrothersAndArms</title>

  <!-- "Add to Home Screen" on iPhone: opens full-screen like a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grind">
  <meta name="theme-color" content="#f2ede3">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    :root {
      --bg: #efe3d0;
      --ink: #221d15;
      --muted: #8a7c66;
      --line: #ddccae;
      --card: #f7ecd9;
      --card-feed: #f1e2c4;
      --card-chat: #eee0c3;
      --card-calendar: #f4e7cc;
      --card-weight: #f0dfbe;
      --accent: #d1372c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    a, button { font-family: inherit; }
    .caps { text-transform: uppercase; letter-spacing: 0.04em; }

    /* ---- auth screens ---- */
    .auth-card { max-width: 360px; margin: 64px auto; }
    .auth-card h1 { font-size: 1.1rem; text-align: center; margin-bottom: 24px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.78rem; color: var(--muted); }
    input, textarea {
      width: 100%;
      font-family: inherit;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-size: 0.95rem;
    }
    textarea { resize: vertical; min-height: 60px; }
    button {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.link {
      background: none;
      border: none;
      color: var(--ink);
      text-decoration: underline;
      padding: 4px 0;
      font-size: 0.8rem;
      text-align: left;
    }
    .error { color: #a43b3b; font-size: 0.82rem; min-height: 1.2em; }
    .msg { color: #3b6b47; font-size: 0.82rem; min-height: 1.2em; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

    .profile-row { display: flex; align-items: center; gap: 12px; }
    .profile-avatar-btn {
      position: relative;
      width: 40px; height: 40px; border-radius: 50%;
      border: none; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.8rem; font-weight: 700;
      overflow: hidden;
    }
    .profile-avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-avatar-badge {
      position: absolute; bottom: -2px; right: -2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--ink); border: 2px solid var(--bg);
      font-size: 0.55rem; display: flex; align-items: center; justify-content: center;
    }

    /* ---- dashboard header ---- */
    header.app-header {
      display: flex; justify-content: center; align-items: center;
      flex-wrap: wrap; gap: 32px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px; margin-bottom: 20px;
      text-align: center;
    }
    .brand { font-weight: 800; font-size: 1.15rem; letter-spacing: 0.08em; }
    .center-date { min-width: 200px; }
    .clock { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.02em; }
    .clock .ampm { font-size: 0.95rem; margin-left: 2px; }
    .countdown-label { font-size: 0.68rem; color: var(--muted); }
    .countdown-num { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1.1; }

    /* ---- check-in card ---- */
    .card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
      background: var(--card);
    }
    .card-feed { background: var(--card-feed); }
    .card-chat { background: var(--card-chat); }
    .card-calendar { background: var(--card-calendar); }
    .card-weight { background: var(--card-weight); }
    .card h2 { font-size: 1rem; letter-spacing: 0.08em; margin: 0 0 16px; }
    .step-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.06em; }
    .group-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .group-btn {
      flex: 1 1 100px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      padding: 10px 6px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
    }
    .group-btn.selected { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .bottom-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
    .notes-col { flex: 2 1 260px; display: flex; flex-direction: column; gap: 8px; }
    .duration-col { display: flex; flex-direction: column; gap: 8px; }
    .duration-inputs { display: flex; align-items: center; gap: 6px; }
    .duration-inputs input { width: 60px; text-align: center; }
    .duration-labels { display: flex; gap: 24px; font-size: 0.65rem; color: var(--muted); justify-content: center; }
    .rating-col { flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px; }
    .rating-inputs { display: flex; align-items: center; gap: 10px; }
    .rating-inputs input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .rating-value { font-size: 0.85rem; font-weight: 700; min-width: 70px; text-align: right; }
    .log-btn { flex: 1 1 160px; align-self: stretch; }

    /* ---- tabs ---- */
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      padding: 8px 18px;
      font-size: 0.78rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    /* ---- today's check-ins ---- */
    .feed-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .feed-head h2 { margin: 0; }
    .feed-count { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.05em; }
    .feed-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .feed-row:first-of-type { border-top: none; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.72rem; font-weight: 700;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .feed-name { font-weight: 700; min-width: 70px; }
    .feed-meta { color: var(--muted); font-size: 0.8rem; min-width: 90px; }
    .feed-notes { flex: 1 1 160px; font-size: 0.85rem; }
    .feed-time { color: var(--muted); font-size: 0.78rem; margin-left: auto; white-space: nowrap; }
    .empty { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }

    /* ---- crew chat ---- */
    .chat-messages {
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .chat-msg { display: flex; gap: 10px; align-items: flex-start; }
    .chat-body { flex: 1; }
    .chat-head { display: flex; gap: 8px; align-items: baseline; }
    .chat-name { font-weight: 700; font-size: 0.82rem; }
    .chat-time { color: var(--muted); font-size: 0.7rem; }
    .chat-text { font-size: 0.88rem; margin-top: 2px; overflow-wrap: anywhere; }
    .chat-image { max-width: 220px; max-height: 220px; border-radius: 6px; display: block; margin-top: 6px; }
    .chat-form { display: flex; flex-direction: row; gap: 8px; }
    .chat-form input[type="text"] { flex: 1; }
    .chat-form button { flex: none; width: auto; padding: 10px 18px; }
    .chat-photo-btn {
      flex: none; width: 42px; padding: 0;
      font-size: 1.1rem; line-height: 1;
      background: var(--bg); color: var(--ink); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
    }

    .points {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.82em;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ---- calendar ---- */
    .cal-total { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.04em; }
    .cal-breakdown { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; font-size: 0.8rem; }
    .cal-person { display: flex; align-items: center; gap: 6px; font-weight: 700; }
    .cal-swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .cal-weekdays, .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    }
    .cal-weekdays { margin-bottom: 6px; }
    .cal-weekdays span { text-align: center; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.05em; }
    .cal-cell {
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px;
      font-size: 0.7rem;
    }
    .cal-cell.empty { border: none; }
    .cal-daynum { color: var(--muted); }
    .cal-dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .cal-dot {
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.55rem; font-weight: 700;
    }

    /* ---- weight ---- */
    .weight-form { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 20px; }
    .weight-form input { width: 120px; }
    .weight-form button { flex: none; width: auto; padding: 10px 18px; }
    .weight-status { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    #weight-chart { margin-bottom: 20px; }
    .weight-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .weight-table th, .weight-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .weight-table th { color: var(--muted); font-weight: 400; letter-spacing: 0.04em; }
    .photo-picker-btn {
      width: 96px; height: 96px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
      font-size: 0.68rem;
      cursor: pointer;
      padding: 6px;
    }
    .photo-picker-btn .icon { font-size: 1.6rem; }
    .photo-preview-wrap { display: none; position: relative; width: 96px; }
    .photo-preview-wrap img {
      width: 96px; height: 96px; object-fit: cover; border-radius: 8px;
      display: block; border: 1px solid var(--line);
    }
    .photo-preview-remove {
      position: absolute; top: -6px; right: -6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--ink); color: var(--bg);
      border: 2px solid var(--card);
      font-size: 0.85rem; line-height: 1; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-picker.has-photo .photo-picker-btn { display: none; }
    .photo-picker.has-photo .photo-preview-wrap { display: block; }
    .weight-gallery { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 20px; }
    .weight-photo-card { width: 120px; text-decoration: none; color: inherit; }
    .weight-photo-card img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; display: block; border: 1px solid var(--line); }
    .weight-photo-caption { font-size: 0.7rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }

    footer.app-footer {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"><p>Loading…</p></div>

  <script type="module">
    import api from './js/api.js';
    import { MUSCLE_TAGS, tagsToType, parseType } from './js/routines.js';

    const app = document.getElementById('app');
    let mode = 'login'; // 'login' | 'signup'
    let cleanup = [];   // active listeners/timers for the currently rendered view

    function teardown() {
      cleanup.forEach((fn) => fn());
      cleanup = [];
    }

    function render(session) {
      teardown();
      const { user, member, crew } = session;
      if (!user) return renderAuthForm();
      if (!member || !crew) return renderJoinForm(user);
      return renderDashboard(member, crew);
    }

    // ---------------------------------------------------------------------
    // Auth screens
    // ---------------------------------------------------------------------
    function renderAuthForm() {
      const isSignup = mode === 'signup';
      app.innerHTML = `
        <div class="auth-card">
          <h1 class="caps">BrothersAndArms</h1>
          <form id="auth-form">
            <label class="caps">Email</label>
            <input type="email" name="email" autocomplete="email" required>
            <label class="caps">Password</label>
            <input type="password" name="password" autocomplete="${isSignup ? 'new-password' : 'current-password'}" required minlength="6">
            ${isSignup ? `
              <label class="caps">Your name</label>
              <input type="text" name="displayName" required maxlength="40">
              <label class="caps">Invite code</label>
              <input type="text" name="groupCode" required>
            ` : ''}
            <p class="error" id="error"></p>
            <button type="submit" class="caps">${isSignup ? 'Sign up' : 'Log in'}</button>
          </form>
          <div class="row" style="margin-top: 14px;">
            <button class="link" id="toggle-mode">${isSignup ? 'Already have an account? Log in' : "New here? Sign up"}</button>
            ${isSignup ? '' : '<button class="link" id="forgot">Forgot password?</button>'}
          </div>
        </div>
      `;

      const form = document.getElementById('auth-form');
      const errorEl = document.getElementById('error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.className = 'error';
        errorEl.textContent = '';
        const data = Object.fromEntries(new FormData(form));
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
          if (isSignup) await api.signup(data);
          else await api.login(data.email, data.password);
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          submitBtn.disabled = false;
        }
      });

      document.getElementById('toggle-mode').addEventListener('click', () => {
        mode = isSignup ? 'login' : 'signup';
        renderAuthForm();
      });

      const forgotBtn = document.getElementById('forgot');
      if (forgotBtn) {
        forgotBtn.addEventListener('click', async () => {
          const email = form.email.value;
          if (!email) { errorEl.className = 'error'; errorEl.textContent = 'Enter your email above first.'; return; }
          try {
            await api.resetPassword(email);
            errorEl.className = 'msg';
            errorEl.textContent = 'Password reset email sent.';
          } catch (err) {
            errorEl.className = 'error';
            errorEl.textContent = err.message;
          }
        });
      }
    }

    function renderJoinForm(user) {
      app.innerHTML = `
        <div class="auth-card">
          <h1 class="caps">BrothersAndArms</h1>
          <p style="font-size: 0.85rem; color: var(--muted);">Logged in as ${escapeHtml(user.email)}. Enter your invite code to join the crew.</p>
          <form id="join-form">
            <label class="caps">Your name</label>
            <input type="text" name="displayName" required maxlength="40">
            <label class="caps">Invite code</label>
            <input type="text" name="groupCode" required>
            <p class="error" id="error"></p>
            <button type="submit" class="caps">Join crew</button>
          </form>
          <div class="row" style="margin-top: 14px;">
            <button class="link" id="signout">Log out</button>
          </div>
        </div>
      `;
      const form = document.getElementById('join-form');
      const errorEl = document.getElementById('error');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        const data = Object.fromEntries(new FormData(form));
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
          await api.joinCrew(data);
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          submitBtn.disabled = false;
        }
      });
      document.getElementById('signout').addEventListener('click', () => api.logout());
    }

    // ---------------------------------------------------------------------
    // Dashboard
    // ---------------------------------------------------------------------
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    // Deterministic per-name color, shared by the avatars and the weight chart --
    // generic (not hardcoded per person) since any crew can sign up. A member can
    // still get a fixed color by setting a `color` field on their profile in the
    // console (e.g. '#e0b400'); pass it in as the second argument to use it.
    const AVATAR_COLORS = ['#3f6f5f', '#5b6b8c', '#8a7a4b', '#8c5b5b', '#4b6b8a', '#6b5b8c', '#e0b400', '#a8453a'];
    function avatarColor(name, color) {
      if (color) return color;
      let h = 0;
      for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }
    function initials(name) {
      const tokens = String(name || '?').trim().split(/\s+/);
      if (tokens.length >= 2) return (tokens[0][0] + tokens[tokens.length - 1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }
    function formatDuration(min) {
      if (!min) return '—';
      const h = Math.floor(min / 60), m = min % 60;
      return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
    }
    function daysUntil(dateStr, todayStr) {
      const [y1, m1, d1] = todayStr.split('-').map(Number);
      const [y2, m2, d2] = dateStr.split('-').map(Number);
      const diff = Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1);
      return Math.max(0, Math.round(diff / 86400000));
    }

    function renderDashboard(member, crew) {
      const selectedTags = new Set();

      app.innerHTML = `
        <header class="app-header">
          <div>
            <div class="brand">${escapeHtml(crew.name.toUpperCase())}</div>
          </div>
          <div class="center-date">
            <div class="clock" id="clock"></div>
          </div>
          ${crew.competitionDate ? `
            <div class="countdown">
              <div class="countdown-label caps">Competition in</div>
              <div class="countdown-num" id="countdown-num"></div>
              <div class="countdown-label caps">Days</div>
            </div>
          ` : ''}
        </header>

        <div class="row" style="margin-bottom: 16px;">
          <div class="profile-row">
            <button type="button" class="profile-avatar-btn" id="profile-avatar-btn" title="Change profile photo" style="background:${avatarColor(member.displayName, member.color)}">
              <span id="profile-avatar-placeholder" style="${member.avatarUrl ? 'display:none;' : ''}">${escapeHtml(initials(member.displayName))}</span>
              <img id="profile-avatar-img" src="${member.avatarUrl ? escapeHtml(member.avatarUrl) : ''}" style="${member.avatarUrl ? '' : 'display:none;'}" alt="Your profile photo">
              <span class="profile-avatar-badge">📷</span>
            </button>
            <input type="file" id="profile-avatar-input" accept="image/*" style="display:none;">
            <div>Logged in as <strong>${escapeHtml(member.displayName)}</strong> <span class="points" id="my-points"></span></div>
          </div>
          <button class="link" id="signout">Log out</button>
        </div>

        <div class="tabs">
          <button class="tab-btn caps active" id="tab-btn-checkin">Check In</button>
          <button class="tab-btn caps" id="tab-btn-chat">Chat</button>
          <button class="tab-btn caps" id="tab-btn-calendar">Calendar</button>
          <button class="tab-btn caps" id="tab-btn-weight">Weight</button>
        </div>

        <div id="tab-checkin">
          <div class="card card-checkin">
            <h2 class="caps">Check in</h2>

            <div class="step-label caps">1. What did you hit today?</div>
            <div class="group-row" id="group-row"></div>

            <div class="bottom-row">
              <div class="notes-col">
                <div class="step-label caps">2. Notes</div>
                <textarea id="notes" placeholder="How did it go? PRs? Anything to note?" maxlength="1000"></textarea>
              </div>
              <div class="duration-col">
                <div class="step-label caps">3. Workout duration</div>
                <div class="duration-inputs">
                  <input type="number" id="hours" min="0" max="24" value="0">
                  <span>:</span>
                  <input type="number" id="minutes" min="0" max="59" value="0">
                </div>
                <div class="duration-labels caps"><span>Hours</span><span>Minutes</span></div>
              </div>
              <div class="rating-col">
                <div class="step-label caps">4. How did it feel?</div>
                <div class="rating-inputs">
                  <input type="range" id="rating" min="1" max="5" step="1" value="3">
                  <span class="rating-value" id="rating-value"></span>
                </div>
              </div>
              <button class="log-btn caps" id="log-btn">Log workout</button>
            </div>
            <p class="error" id="log-error"></p>
          </div>

          <div class="card card-feed">
            <div class="feed-head">
              <h2 class="caps">Today's check-ins</h2>
              <div class="feed-count caps" id="feed-count"></div>
            </div>
            <div id="feed-list"><p class="empty">Loading…</p></div>
          </div>
        </div>

        <div id="tab-chat" style="display:none;">
          <div class="card card-chat">
            <h2 class="caps">Crew chat</h2>
            <div class="chat-messages" id="chat-messages"><p class="empty">Loading…</p></div>
            <form id="chat-form" class="chat-form">
              <input type="text" id="chat-input" placeholder="Message the crew..." maxlength="2000">
              <input type="file" id="chat-photo-input" accept="image/*" style="display:none;">

              <button type="submit" class="caps">Send</button>
            </form>
            <p class="error" id="chat-error"></p>
          </div>
        </div>

        <div id="tab-calendar" style="display:none;">
          <div class="card card-calendar">
            <div class="row" style="margin-bottom: 8px;">
              <button class="link" id="cal-prev">&larr; Prev</button>
              <h2 class="caps" id="cal-title" style="margin:0;"></h2>
              <button class="link" id="cal-next">Next &rarr;</button>
            </div>
            <div class="cal-total caps" id="cal-total"></div>
            <div class="cal-breakdown" id="cal-breakdown"></div>
            <div class="cal-weekdays caps">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
        </div>

        <div id="tab-weight" style="display:none;">
          <div class="card card-weight">
            <h2 class="caps">Monthly weigh-in</h2>
            <div class="weight-status" id="weight-status"></div>
            <form class="weight-form" id="weight-form">
              <div>
                <label class="caps">Weight (lb)</label>
                <input type="number" id="weight-input" min="1" max="1000" step="0.1" required>
              </div>
              <div class="photo-picker" id="weight-photo-picker">
                <label class="caps">Progress photo</label>
                <input type="file" id="weight-photo-input" accept="image/*" capture="environment" required style="display:none;">
                <button type="button" class="photo-picker-btn" id="weight-photo-btn">
                  <span class="icon">📷</span>
                  <span>Add photo</span>
                </button>
                <div class="photo-preview-wrap" id="weight-photo-preview-wrap">
                  <img id="weight-photo-preview-img" alt="Selected progress photo">
                  <button type="button" class="photo-preview-remove" id="weight-photo-remove" title="Remove photo">&times;</button>
                </div>
              </div>
              <button type="submit" class="caps">Log weight</button>
            </form>
            <p class="error" id="weight-error"></p>
            <div id="weight-chart"></div>
            <table class="weight-table" id="weight-table"></table>
            <div class="weight-gallery" id="weight-gallery"></div>
          </div>
        </div>

        <footer class="app-footer caps">
          <span>BrothersAndArms</span>
        </footer>
      `;

      document.getElementById('signout').addEventListener('click', () => api.logout());

      const avatarBtn = document.getElementById('profile-avatar-btn');
      const avatarInput = document.getElementById('profile-avatar-input');
      const avatarImg = document.getElementById('profile-avatar-img');
      const avatarPlaceholder = document.getElementById('profile-avatar-placeholder');
      avatarBtn.addEventListener('click', () => avatarInput.click());
      avatarInput.addEventListener('change', async () => {
        const file = avatarInput.files[0];
        if (!file) return;
        avatarBtn.disabled = true;
        try {
          avatarImg.src = URL.createObjectURL(file);
          avatarImg.style.display = '';
          avatarPlaceholder.style.display = 'none';
          await api.setAvatar(file);
        } catch (err) {
          window.alert(err.message);
        } finally {
          avatarBtn.disabled = false;
          avatarInput.value = '';
        }
      });

      const tabs = {
        checkin: { panel: document.getElementById('tab-checkin'), btn: document.getElementById('tab-btn-checkin') },
        chat: { panel: document.getElementById('tab-chat'), btn: document.getElementById('tab-btn-chat') },
        calendar: { panel: document.getElementById('tab-calendar'), btn: document.getElementById('tab-btn-calendar') },
        weight: { panel: document.getElementById('tab-weight'), btn: document.getElementById('tab-btn-weight') },
      };
      function showTab(name) {
        Object.entries(tabs).forEach(([key, t]) => {
          t.panel.style.display = key === name ? '' : 'none';
          t.btn.classList.toggle('active', key === name);
        });
        if (name === 'calendar') loadCalendarMonth();
        if (name === 'weight') loadWeightTab();
        if (name === 'chat') chatList.scrollTop = chatList.scrollHeight;
      }
      tabs.checkin.btn.addEventListener('click', () => showTab('checkin'));
      tabs.chat.btn.addEventListener('click', () => showTab('chat'));
      tabs.calendar.btn.addEventListener('click', () => showTab('calendar'));
      tabs.weight.btn.addEventListener('click', () => showTab('weight'));

      // ---- clock / date ----
      function tick() {
        const now = new Date();
        const dateStr = `${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}/${now.getFullYear()}`;
        const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const [h, ampm] = time.split(' ');
        document.getElementById('clock').innerHTML =
          `${h}<span class="ampm">${ampm || ''}</span> on ${dateStr}`;
        if (crew.competitionDate) {
          document.getElementById('countdown-num').textContent = daysUntil(crew.competitionDate, api.today());
        }
      }
      tick();
      const clockTimer = setInterval(tick, 1000);
      cleanup.push(() => clearInterval(clockTimer));

      // ---- check-in form ----
      const groupRow = document.getElementById('group-row');
      MUSCLE_TAGS.forEach((tag) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'group-btn caps';
        btn.textContent = tag.label;
        btn.dataset.tagId = tag.id;
        btn.addEventListener('click', () => {
          if (tag.id === 'rest') {
            selectedTags.clear();
            selectedTags.add('rest');
          } else {
            selectedTags.delete('rest');
            if (selectedTags.has(tag.id)) selectedTags.delete(tag.id);
            else selectedTags.add(tag.id);
          }
          renderGroupSelection();
        });
        groupRow.appendChild(btn);
      });

      function renderGroupSelection() {
        [...groupRow.children].forEach((btn) => {
          btn.classList.toggle('selected', selectedTags.has(btn.dataset.tagId));
        });
      }

      const RATING_LABELS = ['Rough', 'Tough', 'OK', 'Good', 'Crushed it'];
      const ratingInput = document.getElementById('rating');
      const ratingValue = document.getElementById('rating-value');
      function renderRatingValue() {
        ratingValue.textContent = `${ratingInput.value} — ${RATING_LABELS[Number(ratingInput.value) - 1]}`;
      }
      ratingInput.addEventListener('input', renderRatingValue);
      renderRatingValue();

      const logError = document.getElementById('log-error');
      document.getElementById('log-btn').addEventListener('click', async () => {
        logError.textContent = '';
        if (!selectedTags.size) { logError.textContent = 'Pick at least one muscle group.'; return; }
        const hours = Number(document.getElementById('hours').value) || 0;
        const minutes = Number(document.getElementById('minutes').value) || 0;
        const notes = document.getElementById('notes').value;
        const type = tagsToType([...selectedTags]);

        const btn = document.getElementById('log-btn');
        btn.disabled = true;
        try {
          await api.logWorkout({
            performedOn: api.today(),
            type,
            durationMin: hours * 60 + minutes,
            notes,
            rating: Number(ratingInput.value),
            exercises: [],
          });
          selectedTags.clear();
          renderGroupSelection();
          document.getElementById('notes').value = '';
          document.getElementById('hours').value = 0;
          document.getElementById('minutes').value = 0;
          ratingInput.value = 3;
          renderRatingValue();
        } catch (err) {
          logError.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });

      // ---- ranking points: 10 per logged workout, 0 for rest, all-time ----
      let rankings = {}; // userId -> points
      const pointsFor = (userId) => rankings[userId] || 0;
      const nameWithPoints = (name, userId) => `${escapeHtml(name)} <span class="points">[${pointsFor(userId)}]</span>`;

      async function loadRankings() {
        const workouts = await fetchAllWorkouts();
        const counts = {};
        workouts.forEach((w) => {
          if (w.type === 'rest') return;
          counts[w.userId] = (counts[w.userId] || 0) + 1;
        });
        rankings = Object.fromEntries(Object.entries(counts).map(([id, c]) => [id, c * 10]));
        document.getElementById('my-points').textContent = `[${pointsFor(api.currentUserId())}]`;
        renderFeed();
        renderChatList();
      }

      // ---- today's check-ins (live) ----
      let members = [];
      let todaysWorkouts = [];

      function avatarHtml(name, userId) {
        const person = members.find((m) => m.id === userId);
        const bg = avatarColor(name, person?.color);
        if (person && person.avatarUrl) {
          return `<div class="avatar" style="background:${bg}"><img src="${escapeHtml(person.avatarUrl)}" alt="${escapeHtml(name)}"></div>`;
        }
        return `<div class="avatar" style="background:${bg}">${escapeHtml(initials(name))}</div>`;
      }

      function renderFeed() {
        const byId = Object.fromEntries(members.map((m) => [m.id, m]));
        const list = document.getElementById('feed-list');
        const countEl = document.getElementById('feed-count');
        const checkedInIds = new Set(todaysWorkouts.map((w) => w.userId));
        countEl.textContent = `${checkedInIds.size} / ${members.length} checked in`;

        if (!todaysWorkouts.length) {
          list.innerHTML = '<p class="empty">No check-ins yet today.</p>';
          return;
        }
        list.innerHTML = todaysWorkouts.map((w) => {
          const person = byId[w.userId];
          const name = person ? person.displayName : 'Someone';
          const { label } = parseType(w.type);
          const time = w.createdAt
            ? w.createdAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
            : '';
          return `
            <div class="feed-row">
              ${avatarHtml(name, w.userId)}
              <div class="feed-name">${nameWithPoints(name, w.userId)}</div>
              <div class="feed-meta">${escapeHtml(label)}</div>
              <div class="feed-meta">${formatDuration(w.durationMin)}</div>
              <div class="feed-meta">${w.rating ? '★'.repeat(w.rating) + '☆'.repeat(5 - w.rating) : ''}</div>
              <div class="feed-notes">${escapeHtml(w.notes || '')}</div>
              <div class="feed-time">${escapeHtml(time)}</div>
            </div>
          `;
        }).join('');
      }

      const unwatchMembers = api.watchMembers(member.crewId, (m) => { members = m; renderFeed(); });
      const unwatchFeed = api.watchFeed((workouts) => {
        const today = api.today();
        todaysWorkouts = workouts.filter((w) => w.performedOn === today);
        renderFeed();
        loadRankings();
      }, { crewId: member.crewId, pageSize: 50 });
      cleanup.push(unwatchMembers, unwatchFeed);

      // ---- crew chat (live, full history) ----
      const chatList = document.getElementById('chat-messages');
      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');
      const chatError = document.getElementById('chat-error');

      let chatMessages = [];
      function renderChatList() {
        const wasAtBottom = chatList.scrollTop + chatList.clientHeight >= chatList.scrollHeight - 20;
        if (!chatMessages.length) {
          chatList.innerHTML = '<p class="empty">No messages yet. Say hi.</p>';
          return;
        }
        chatList.innerHTML = chatMessages.map((m) => {
          const time = m.createdAt
            ? m.createdAt.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
            : 'sending…';
          return `
            <div class="chat-msg">
              ${avatarHtml(m.displayName, m.userId)}
              <div class="chat-body">
                <div class="chat-head">
                  <span class="chat-name">${nameWithPoints(m.displayName, m.userId)}</span>
                  <span class="chat-time">${escapeHtml(time)}</span>
                </div>
                ${m.text ? `<div class="chat-text">${escapeHtml(m.text)}</div>` : ''}
                ${m.imageUrl ? `<a href="${escapeHtml(m.imageUrl)}" target="_blank" rel="noopener"><img class="chat-image" src="${escapeHtml(m.imageUrl)}" alt="Shared photo"></a>` : ''}
              </div>
            </div>
          `;
        }).join('');
        if (wasAtBottom) chatList.scrollTop = chatList.scrollHeight;
      }

      const unwatchChat = api.watchChat(member.crewId, (messages) => {
        chatMessages = messages;
        renderChatList();
      }, (err) => { chatError.textContent = err.message; });
      chatList.scrollTop = chatList.scrollHeight;
      cleanup.push(unwatchChat);

      const chatPhotoBtn = document.getElementById('chat-photo-btn');
      const chatPhotoInput = document.getElementById('chat-photo-input');
      chatPhotoBtn.addEventListener('click', () => chatPhotoInput.click());
      chatPhotoInput.addEventListener('change', async () => {
        const file = chatPhotoInput.files[0];
        if (!file) return;
        chatError.textContent = '';
        chatPhotoBtn.disabled = true;
        try {
          await api.sendPhoto(file, chatInput.value);
          chatInput.value = '';
          chatList.scrollTop = chatList.scrollHeight;
        } catch (err) {
          chatError.textContent = err.message;
        } finally {
          chatPhotoBtn.disabled = false;
          chatPhotoInput.value = '';
        }
      });

      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        chatError.textContent = '';
        const text = chatInput.value;
        if (!text.trim()) return;
        const btn = chatForm.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          await api.sendMessage(text);
          chatInput.value = '';
          chatList.scrollTop = chatList.scrollHeight;
        } catch (err) {
          chatError.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });

      // ---- calendar (month view) ----
      const calState = { year: new Date().getFullYear(), month: new Date().getMonth() }; // month: 0-11
      const CAL_START_YEAR = calState.year, CAL_START_MONTH = calState.month; // don't allow browsing before now
      const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      const pad2 = (n) => String(n).padStart(2, '0');
      const firstInitial = (name) => (String(name || '?').trim()[0] || '?').toUpperCase();

      async function fetchAllWorkouts(filters = {}) {
        let cursor = null;
        let all = [];
        do {
          const res = await api.feed({ crewId: member.crewId, ...filters, pageSize: 100, cursor });
          all = all.concat(res.workouts);
          cursor = res.cursor;
        } while (cursor);
        return all;
      }

      async function loadCalendarMonth() {
        const { year, month } = calState;
        document.getElementById('cal-title').textContent = `${MONTH_NAMES[month]} ${year}`;
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = '<p class="empty">Loading…</p>';

        const lastDay = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
        const from = `${year}-${pad2(month + 1)}-01`;
        const to = `${year}-${pad2(month + 1)}-${pad2(lastDay)}`;

        const byId = Object.fromEntries(members.map((m) => [m.id, m]));
        const workouts = (await fetchAllWorkouts({ from, to })).filter((w) => w.type !== 'rest');

        const byDate = {};
        const rawCounts = {};
        workouts.forEach((w) => {
          (byDate[w.performedOn] ??= new Set()).add(w.userId);
          rawCounts[w.userId] = (rawCounts[w.userId] || 0) + 1;
        });
        document.getElementById('cal-total').textContent = 'Workouts logged this month:';
        document.getElementById('cal-breakdown').innerHTML = [...members]
          .sort((a, b) => (rawCounts[b.id] || 0) - (rawCounts[a.id] || 0))
          .map((m) => `
            <span class="cal-person">
              <span class="cal-swatch" style="background:${avatarColor(m.displayName, m.color)}"></span>
              ${escapeHtml(m.displayName)}: ${rawCounts[m.id] || 0}
            </span>
          `).join('');

        const firstWeekday = new Date(Date.UTC(year, month, 1)).getUTCDay();
        const cells = [];
        for (let i = 0; i < firstWeekday; i++) cells.push('<div class="cal-cell empty"></div>');
        for (let day = 1; day <= lastDay; day++) {
          const dateStr = `${year}-${pad2(month + 1)}-${pad2(day)}`;
          const dots = [...(byDate[dateStr] || [])].map((id) => {
            const name = byId[id] ? byId[id].displayName : '?';
            return `<div class="cal-dot" style="background:${avatarColor(name, byId[id]?.color)}">${escapeHtml(firstInitial(name))}</div>`;
          }).join('');
          cells.push(`
            <div class="cal-cell">
              <div class="cal-daynum">${day}</div>
              <div class="cal-dots">${dots}</div>
            </div>
          `);
        }
        grid.innerHTML = cells.join('');
        document.getElementById('cal-next').disabled = atCompetitionCap();
        document.getElementById('cal-prev').disabled = atStartCap();
      }

      // Falls back to two years out if this crew has no competition date set.
      const fallbackCompDate = (() => {
        const d = new Date();
        d.setFullYear(d.getFullYear() + 2);
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      })();
      const [compYear, compMonth] = (crew.competitionDate || fallbackCompDate).split('-').map(Number); // compMonth is 1-indexed
      const atCompetitionCap = () => calState.year > compYear || (calState.year === compYear && calState.month >= compMonth - 1);
      const atStartCap = () => calState.year < CAL_START_YEAR || (calState.year === CAL_START_YEAR && calState.month <= CAL_START_MONTH);

      document.getElementById('cal-prev').addEventListener('click', () => {
        if (atStartCap()) return;
        calState.month -= 1;
        if (calState.month < 0) { calState.month = 11; calState.year -= 1; }
        loadCalendarMonth();
      });
      document.getElementById('cal-next').addEventListener('click', () => {
        if (atCompetitionCap()) return;
        calState.month += 1;
        if (calState.month > 11) { calState.month = 0; calState.year += 1; }
        loadCalendarMonth();
      });

      // ---- monthly weigh-in ----
      const monthLabel = (month) => {
        const [y, m] = month.split('-').map(Number);
        return `${MONTH_NAMES[m - 1]} ${y}`;
      };

      function monthRange(start, end) {
        const months = [];
        let [y, m] = start.split('-').map(Number);
        const [ey, em] = end.split('-').map(Number);
        while (y < ey || (y === ey && m <= em)) {
          months.push(`${y}-${pad2(m)}`);
          m += 1;
          if (m > 12) { m = 1; y += 1; }
        }
        return months;
      }
      const compTotalMonths = compYear * 12 + (compMonth - 1);
      const chartStartTotal = compTotalMonths - 24;
      const CHART_START = `${Math.floor(chartStartTotal / 12)}-${pad2((chartStartTotal % 12) + 1)}`;
      const CHART_END = `${compYear}-${pad2(compMonth)}`;

      let allWeights = [];

      function renderWeightChart() {
        const container = document.getElementById('weight-chart');
        if (!allWeights.length) {
          container.innerHTML = '<p class="empty">No weigh-ins logged yet.</p>';
          return;
        }
        const months = monthRange(CHART_START, CHART_END);
        const W = 680, H = 280, padL = 38, padR = 92, padT = 16, padB = 24;
        const plotW = W - padL - padR, plotH = H - padT - padB;
        const xAt = (i) => padL + (i / (months.length - 1)) * plotW;

        const vals = allWeights.map((w) => w.weight);
        const min = Math.floor((Math.min(...vals) - 5) / 5) * 5;
        const max = Math.ceil((Math.max(...vals) + 5) / 5) * 5;
        const yAt = (val) => padT + plotH - ((val - min) / (max - min || 1)) * plotH;

        const byMonthUser = {};
        allWeights.forEach((w) => { (byMonthUser[w.month] ??= {})[w.userId] = w.weight; });

        const tickCount = 4;
        const gridSvg = Array.from({ length: tickCount + 1 }, (_, i) => min + (i * (max - min)) / tickCount)
          .map((t) => `
            <line x1="${padL}" y1="${yAt(t)}" x2="${W - padR}" y2="${yAt(t)}" stroke="#e1e0d9" stroke-width="1"/>
            <text x="${padL - 6}" y="${yAt(t) + 3}" text-anchor="end" font-size="10" fill="#898781">${Math.round(t)}</text>
          `).join('');

        const xLabelsSvg = months.map((mo, i) => {
          if (i % 3 !== 0 && i !== months.length - 1) return '';
          const [yr, mNum] = mo.split('-').map(Number);
          return `<text x="${xAt(i)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="#898781">${MONTH_NAMES[mNum - 1].slice(0, 3)} '${String(yr).slice(2)}</text>`;
        }).join('');

        const linesSvg = members.map((m) => {
          const color = avatarColor(m.displayName, m.color);
          const pts = months
            .map((mo, i) => (byMonthUser[mo]?.[m.id] != null ? { i, v: byMonthUser[mo][m.id] } : null))
            .filter(Boolean);
          if (!pts.length) return '';
          const path = pts.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${xAt(p.i)} ${yAt(p.v)}`).join(' ');
          const dots = pts.map((p) => `
            <circle cx="${xAt(p.i)}" cy="${yAt(p.v)}" r="4" fill="${color}" stroke="#f8f5ee" stroke-width="2">
              <title>${escapeHtml(m.displayName)}: ${p.v} lb (${escapeHtml(monthLabel(months[p.i]))})</title>
            </circle>
          `).join('');
          const last = pts[pts.length - 1];
          const label = `<text x="${xAt(last.i) + 8}" y="${yAt(last.v) + 4}" font-size="10" font-weight="700" fill="#17140f">${escapeHtml(m.displayName)} ${last.v}</text>`;
          return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${label}`;
        }).join('');

        container.innerHTML = `
          <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
            ${gridSvg}${linesSvg}${xLabelsSvg}
          </svg>
          <div class="cal-breakdown">
            ${members.map((m) => `<span class="cal-person"><span class="cal-swatch" style="background:${avatarColor(m.displayName, m.color)}"></span>${escapeHtml(m.displayName)}</span>`).join('')}
          </div>
        `;
      }

      function renderWeightTable() {
        const table = document.getElementById('weight-table');
        const months = [...new Set(allWeights.map((w) => w.month))].sort().reverse();
        if (!months.length) {
          table.innerHTML = '<tr><td class="empty">No weigh-ins logged yet.</td></tr>';
          return;
        }
        const byMonthUser = {};
        allWeights.forEach((w) => { (byMonthUser[w.month] ??= {})[w.userId] = w.weight; });
        table.innerHTML = `
          <tr><th>Month</th>${members.map((m) => `<th>${escapeHtml(m.displayName)}</th>`).join('')}</tr>
          ${months.map((month) => `
            <tr>
              <td>${monthLabel(month)}</td>
              ${members.map((m) => {
                const w = byMonthUser[month]?.[m.id];
                return `<td>${w != null ? `${w} lb` : '—'}</td>`;
              }).join('')}
            </tr>
          `).join('')}
        `;
      }

      function renderWeightGallery() {
        const container = document.getElementById('weight-gallery');
        const byId = Object.fromEntries(members.map((m) => [m.id, m]));
        const sorted = [...allWeights].sort((a, b) => (b.createdAt ?? 0) - (a.createdAt ?? 0));
        if (!sorted.length) { container.innerHTML = ''; return; }
        container.innerHTML = sorted.map((w) => {
          const name = byId[w.userId] ? byId[w.userId].displayName : 'Someone';
          const time = w.createdAt
            ? w.createdAt.toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
            : '';
          return `
            <a class="weight-photo-card" href="${escapeHtml(w.photoUrl)}" target="_blank" rel="noopener">
              <img src="${escapeHtml(w.photoUrl)}" alt="${escapeHtml(name)} progress photo">
              <div class="weight-photo-caption">${escapeHtml(name)} &middot; ${w.weight} lb<br>${escapeHtml(time)}</div>
            </a>
          `;
        }).join('');
      }

      function renderWeightViews() {
        renderWeightChart();
        renderWeightTable();
        renderWeightGallery();
      }

      async function loadWeightTab() {
        const statusEl = document.getElementById('weight-status');
        const form = document.getElementById('weight-form');
        const mine = await api.myWeightThisMonth();
        if (mine) {
          const time = mine.createdAt
            ? mine.createdAt.toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
            : '';
          statusEl.textContent = `You've logged ${mine.weight} lb for ${monthLabel(mine.month)} (${time}). Next check-in opens next month.`;
          form.style.display = 'none';
        } else {
          statusEl.textContent = `Log your weight and a progress photo once for ${monthLabel(api.currentMonth())}.`;
          form.style.display = '';
        }
        renderWeightViews();
      }

      const unwatchWeights = api.watchWeights(member.crewId, (weights) => { allWeights = weights; renderWeightViews(); });
      cleanup.push(unwatchWeights);

      const weightPhotoPicker = document.getElementById('weight-photo-picker');
      const weightPhotoBtn = document.getElementById('weight-photo-btn');
      const weightPhotoInput = document.getElementById('weight-photo-input');
      const weightPhotoPreviewImg = document.getElementById('weight-photo-preview-img');

      weightPhotoBtn.addEventListener('click', () => weightPhotoInput.click());
      weightPhotoInput.addEventListener('change', () => {
        const file = weightPhotoInput.files[0];
        if (!file) return;
        weightPhotoPreviewImg.src = URL.createObjectURL(file);
        weightPhotoPicker.classList.add('has-photo');
      });
      document.getElementById('weight-photo-remove').addEventListener('click', () => {
        weightPhotoInput.value = '';
        weightPhotoPicker.classList.remove('has-photo');
      });

      document.getElementById('weight-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('weight-error');
        errorEl.textContent = '';
        const input = document.getElementById('weight-input');
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          await api.logWeight(input.value, weightPhotoInput.files[0]);
          input.value = '';
          weightPhotoInput.value = '';
          weightPhotoPicker.classList.remove('has-photo');
          await loadWeightTab();
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });
    }

    api.onSessionChange(render);

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
